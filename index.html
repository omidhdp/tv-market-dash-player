<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<title>Market TV Pro player</title>
<style>html, body, #p { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }</style>
</head>
<body>
<div id="p"></div>
<script>
// A YouTube channel's live stream for Market TV Pro. YouTube's player refuses pages without a web address (an
// installed TV app: Error 153), so the app shows this page, published on GitHub Pages, in a frame instead.
// ?c=<channel id>&mute=1. The app sends {mute: true | false}; this page answers {yt: 'ready' | 'playing' | 'ended' |
// 'error', code}. Plain ES5, as the TV's browser may be old.
var c = (/[?&]c=(UC[\w-]{22})(&|$)/.exec(location.search) || [])[1], muted = /[?&]mute=1(&|$)/.test(location.search);
var player = null, started = false;

function tell(m) { if (parent !== window) parent.postMessage(m, '*'); }

function stateChanged(state) {
  if (state === 1 && !started) { started = true; tell({yt: 'playing'}); }
  else if (state === 0 && started) { started = false; tell({yt: 'ended'}); }
}

function onYouTubeIframeAPIReady() {
  player = new YT.Player('p', {videoId: 'live_stream', width: '100%', height: '100%',
    playerVars: {channel: c, autoplay: 1, controls: 0, disablekb: 1, rel: 0, playsinline: 1, iv_load_policy: 3, mute: muted ? 1 : 0},
    events: {
      onReady: function (e) {
        tell({yt: 'ready'});   // YouTube's ads may play first, and no state comes during them
        if (muted) e.target.mute();
        e.target.playVideo();
        // The stream can start before the API listens, and then no state change comes: look every 2 s too.
        setInterval(function () { stateChanged(e.target.getPlayerState()); }, 2000);
      },
      onStateChange: function (e) { stateChanged(e.data); },
      onError: function (e) { tell({yt: 'error', code: e.data}); }
    }});
}

window.addEventListener('message', function (e) {
  var d = e.data;
  if (!player || !player.mute || !d || typeof d.mute !== 'boolean') return;
  muted = d.mute;
  if (muted) player.mute(); else { player.unMute(); player.setVolume(100); }
});

if (c) {
  var s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
} else tell({yt: 'error', code: 'channel'});
</script>
</body>
</html>
